<div
  class="overflow-x-auto card bg-base w-full mx-auto p-10 mt-24 shadow-xl flex flex-col rounded-lg"
>
  <h1 class="card-title self-center mt-2 font-bold text-3xl text-yellow-600">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-9">
      <path
        d="M4.5 6.375a4.125 4.125 0 1 1 8.25 0 4.125 4.125 0 0 1-8.25 0ZM14.25 8.625a3.375 3.375 0 1 1 6.75 0 3.375 3.375 0 0 1-6.75 0ZM1.5 19.125a7.125 7.125 0 0 1 14.25 0v.003l-.001.119a.75.75 0 0 1-.363.63 13.067 13.067 0 0 1-6.761 1.873c-2.472 0-4.786-.684-6.76-1.873a.75.75 0 0 1-.364-.63l-.001-.122ZM17.25 19.128l-.001.144a2.25 2.25 0 0 1-.233.96 10.088 10.088 0 0 0 5.06-1.01.75.75 0 0 0 .42-.643 4.875 4.875 0 0 0-6.957-4.611 8.586 8.586 0 0 1 1.71 5.157v.003Z"
      />
    </svg>

    Clients List
  </h1>
  <table class="table card-body">
    <!-- head -->
    <thead class="text-lg font-bold">
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Phone Number</th>
        <th>Registration Date</th>
        <th>Expiration Date</th>
        <!-- <th>Actions</th> -->
      </tr>
    </thead>
    @for (client of clients$ | async; track client.id) {
      <tbody>
        <!-- row 1 -->
        <tr
          routerLink="/clients/{{ client.id }}"
          class="hover:bg-yellow-200 {{
            client.status === clientStatus.Inactive ? 'bg-red-300' : 'bg-base-100'
          }} transition-all duration-300 ease-in-out transform"
        >
          <th>{{ client.id }}</th>
          <td>{{ client.fullName }}</td>
          <td>{{ client.phoneNumber }}</td>
          <td>{{ client.subscriptionDate | date: 'short' }}</td>
          <td>{{ client.expirationDate | date: 'short' }}</td>
          <td>
            <button
              class="btn btn-neutral bg-yellow-600 border-yellow-600 btn-lg"
              (click)="$event.stopPropagation(); deleteClient(client)"
            >
              X
            </button>
          </td>
        </tr>
      </tbody>
    }
  </table>
</div>
