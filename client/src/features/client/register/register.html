<div class="card">
  <h1 class="card-title self-center mt-2 font-bold text-3xl text-yellow-600">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6">
      <path
        fill-rule="evenodd"
        d="M5.625 1.5c-1.036 0-1.875.84-1.875 1.875v17.25c0 1.035.84 1.875 1.875 1.875h12.75c1.035 0 1.875-.84 1.875-1.875V12.75A3.75 3.75 0 0 0 16.5 9h-1.875a1.875 1.875 0 0 1-1.875-1.875V5.25A3.75 3.75 0 0 0 9 1.5H5.625ZM7.5 15a.75.75 0 0 1 .75-.75h7.5a.75.75 0 0 1 0 1.5h-7.5A.75.75 0 0 1 7.5 15Zm.75 2.25a.75.75 0 0 0 0 1.5H12a.75.75 0 0 0 0-1.5H8.25Z"
        clip-rule="evenodd"
      />
      <path
        d="M12.971 1.816A5.23 5.23 0 0 1 14.25 5.25v1.875c0 .207.168.375.375.375H16.5a5.23 5.23 0 0 1 3.434 1.279 9.768 9.768 0 0 0-6.963-6.963Z"
      />
    </svg>
    Register form
  </h1>
  <div class="card-body w-full">
    <form #registerForm="ngForm" class="flex flex-col gap-4 w-full" (ngSubmit)="register()">
      <input
        class="input w-full border-yellow-600"
        name="fullName"
        [(ngModel)]="clientInfo.fullName"
        placeholder="Full name"
      />
      <input
        type="email"
        class="input w-full border-yellow-600"
        name="email"
        [(ngModel)]="clientInfo.email"
        placeholder="Email"
      />
      <input
        class="input w-full border-yellow-600"
        name="dateOfBirth"
        [(ngModel)]="clientInfo.dateOfBirth"
        placeholder="Date of birth"
      />
      <input
        class="input w-full border-yellow-600"
        name="phoneNumber"
        [(ngModel)]="clientInfo.phoneNumber"
        placeholder="Phone number"
      />
      <input
        class="input w-full border-yellow-600"
        name="subscriptionDate"
        [(ngModel)]="clientInfo.subscriptionDate"
        placeholder="Subscription date"
      />
      <input
        class="input w-full border-yellow-600"
        name="membershipDuration"
        [(ngModel)]="clientInfo.membershipDurationInMonths"
        placeholder="Membership duration"
      />

      <div class="flex items-center justify-end gap-3">
        <button (click)="cancel()" type="button" class="btn btn-neutral bg-black">Cancel</button>
        <button type="submit" class="btn btn-neutral bg-yellow-600 border-yellow-600">
          Register
        </button>
      </div>
    </form>
  </div>
</div>
