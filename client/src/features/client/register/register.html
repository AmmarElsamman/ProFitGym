<div class="@container w-full">
  <h1 class="flex items-center justify-center gap-2 font-bold text-2xl md:text-3xl text-yellow-600">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-7">
      <path
        d="M5.25 6.375a4.125 4.125 0 1 1 8.25 0 4.125 4.125 0 0 1-8.25 0ZM2.25 19.125a7.125 7.125 0 0 1 14.25 0v.003l-.001.119a.75.75 0 0 1-.363.63 13.067 13.067 0 0 1-6.761 1.873c-2.472 0-4.786-.684-6.76-1.873a.75.75 0 0 1-.364-.63l-.001-.122ZM18.75 7.5a.75.75 0 0 0-1.5 0v2.25H15a.75.75 0 0 0 0 1.5h2.25v2.25a.75.75 0 0 0 1.5 0v-2.25H21a.75.75 0 0 0 0-1.5h-2.25V7.5Z"
      />
    </svg>
    Register New Member
  </h1>
  <p class="text-center opacity-60 mt-1">Enter the member's details to create their membership.</p>
  <div class="divider"></div>

  <form
    #registerForm="ngForm"
    (ngSubmit)="register()"
    class="grid grid-cols-1 @lg:grid-cols-2 gap-x-5 gap-y-7"
  >
    <label class="floating-label @lg:col-span-2">
      <span>Full Name</span>
      <input
        type="text"
        required
        placeholder="Full Name"
        class="input input-lg w-full focus:border-yellow-600 focus:outline-yellow-600"
        name="fullName"
        [(ngModel)]="clientInfo.fullName"
      />
    </label>

    <label class="floating-label">
      <span>Email</span>
      <input
        type="email"
        required
        email
        placeholder="Email"
        class="input input-lg w-full focus:border-yellow-600 focus:outline-yellow-600"
        name="email"
        [(ngModel)]="clientInfo.email"
      />
    </label>

    <label class="floating-label">
      <span>Phone Number</span>
      <input
        type="tel"
        required
        placeholder="Phone Number"
        class="input input-lg w-full focus:border-yellow-600 focus:outline-yellow-600"
        name="phoneNumber"
        [(ngModel)]="clientInfo.phoneNumber"
      />
    </label>

    <label class="floating-label">
      <span>Date Of Birth</span>
      <input
        type="date"
        required
        placeholder="Date Of Birth"
        class="input input-lg w-full focus:border-yellow-600 focus:outline-yellow-600"
        name="dateOfBirth"
        [(ngModel)]="clientInfo.dateOfBirth"
      />
    </label>

    <label class="floating-label">
      <span>Subscription Date</span>
      <input
        type="date"
        required
        placeholder="Subscription Date"
        class="input input-lg w-full focus:border-yellow-600 focus:outline-yellow-600"
        name="subscriptionDate"
        [(ngModel)]="clientInfo.subscriptionDate"
      />
    </label>

    <label class="floating-label @lg:col-span-2">
      <span>Membership Duration</span>
      <select
        class="select select-lg w-full focus:border-yellow-600 focus:outline-yellow-600"
        name="membershipDuration"
        [(ngModel)]="clientInfo.membershipDurationInMonths"
      >
        @for (m of durations; track m) {
          <option [ngValue]="m">{{ m }} {{ m === 1 ? 'month' : 'months' }}</option>
        }
      </select>
    </label>

    @if (expiresOn; as date) {
      <div
        class="@lg:col-span-2 rounded-lg bg-base-200 px-4 py-3 flex flex-wrap justify-between items-center gap-2 text-lg"
      >
        <span class="opacity-70">Membership will expire on</span>
        <span class="font-bold text-yellow-600">{{ date | date: 'fullDate' }}</span>
      </div>
    }

    <div class="@lg:col-span-2 flex flex-col-reverse @lg:flex-row @lg:justify-end gap-3 mt-2">
      <button
        type="button"
        (click)="cancel()"
        class="btn btn-neutral bg-black border-black text-xl text-base-300 @lg:w-40"
      >
        Cancel
      </button>
      <button
        type="submit"
        [disabled]="registerForm.invalid"
        class="btn btn-neutral bg-yellow-600 border-yellow-600 text-xl text-base-300 @lg:w-52"
      >
        Register Member
      </button>
    </div>
  </form>
</div>
