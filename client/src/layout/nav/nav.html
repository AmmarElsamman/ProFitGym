<header class="p-2 w-full fixed top-0 z-50 bg-linear-to-r to-yellow-600 from-black">
  <div class="flex flex-row align-middle items-center px-10 mx-auto gap-6">
    <a
      routerLink="/"
      class="flex items-center gap-1 max-h-16 text-yellow-600 uppercase border-r-yellow-600 border-r-2 pr-6 text-2xl"
    >
      <img src="\profitgym_icon.jpg" unselectable="on" alt="ProFit Gym Icon" class="size-20" />
      <h3 class="text-3xl font-semibold text-yellow-600 uppercase">Pro Fit Gym</h3>
    </a>
    <nav class="flex gap-7 my-2 text-2xl text-yellow-600">
      <a routerLink="/check-in" routerLinkActive="text-blue-400">Check-in</a>
      <a
        routerLink="/clients"
        routerLinkActive="text-blue-400"
        [routerLinkActiveOptions]="{ exact: true }"
        >Clients</a
      >
    </nav>
    <div class="flex align-middle ml-auto gap-3">
      @if (accountService.currentUser(); as user) {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="size-10"
        >
          <path
            fill-rule="evenodd"
            d="M18.685 19.097A9.723 9.723 0 0 0 21.75 12c0-5.385-4.365-9.75-9.75-9.75S2.25 6.615 2.25 12a9.723 9.723 0 0 0 3.065 7.097A9.716 9.716 0 0 0 12 21.75a9.716 9.716 0 0 0 6.685-2.653Zm-12.54-1.285A7.486 7.486 0 0 1 12 15a7.486 7.486 0 0 1 5.855 2.812A8.224 8.224 0 0 1 12 20.25a8.224 8.224 0 0 1-5.855-2.438ZM15.75 9a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
            clip-rule="evenodd"
          />
        </svg>

        <span class="text-3xl font-normal text-blue-950">{{ user.displayName }}</span>
        <button type="button" class="btn btn-neutral bg-black" (click)="logout()">Logout</button>
      } @else {
        <form #loginForm="ngForm" (ngSubmit)="login()" class="flex items-center gap-3">
          <input
            [(ngModel)]="creds.displayName"
            name="username"
            type="text"
            class="input"
            placeholder="Username"
          />
          <input
            [(ngModel)]="creds.password"
            name="password"
            type="password"
            class="input"
            placeholder="Password"
          />
          <button type="submit" class="btn btn-neutral bg-yellow-600 border-yellow-600">
            Login
          </button>
        </form>
      }
    </div>
  </div>
</header>
