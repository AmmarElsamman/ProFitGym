<!-- Login form, defined once and reused below -->
<ng-template #loginFields>
  <form (ngSubmit)="login()" class="flex flex-col md:flex-row md:items-center gap-3">
    <input
      [(ngModel)]="creds.displayName"
      name="username"
      type="text"
      class="input"
      placeholder="Username"
    />
    <input
      [(ngModel)]="creds.password"
      name="password"
      type="password"
      class="input"
      placeholder="Password"
    />
    <button type="submit" class="btn btn-neutral bg-yellow-600 border-yellow-600">Login</button>
  </form>
</ng-template>

<header class="p-2 w-full fixed top-0 z-50 bg-linear-to-r to-yellow-600 from-black">
  <div class="flex flex-row items-center gap-3 px-2 md:px-10 md:gap-6">
    <!-- Menu button, phones only, when logged in -->
    @if (accountService.currentUser()) {
      <div class="dropdown md:hidden">
        <div tabindex="0" role="button" class="btn btn-ghost btn-square text-yellow-600">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            class="size-7"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
            />
          </svg>
        </div>
        <ul
          tabindex="0"
          class="menu dropdown-content bg-base-100 rounded-box z-10 mt-3 w-56 p-2 shadow text-lg"
        >
          <li><a routerLink="/clients" routerLinkActive="font-bold">Clients</a></li>
          <li><a routerLink="/check-in" routerLinkActive="font-bold">Check-in</a></li>
          <li><a routerLink="/attendance" routerLinkActive="font-bold">Attendance</a></li>
        </ul>
      </div>
    }

    <!-- Logo and name -->
    <a
      routerLink="/"
      class="flex items-center gap-1 text-yellow-600 uppercase md:border-r-yellow-600 md:border-r-2 md:pr-6"
    >
      <img
        src="\profitgym_icon.jpg"
        unselectable="on"
        alt="ProFit Gym Icon"
        class="size-12 md:size-20"
      />
      <h3
        class="text-lg sm:text-xl md:text-3xl font-semibold text-yellow-600 uppercase whitespace-nowrap"
      >
        Pro Fit Gym
      </h3>
    </a>

    <!-- Links, desktop only -->
    @if (accountService.currentUser()) {
      <nav class="hidden md:flex gap-7 my-2 text-2xl text-yellow-600">
        <a
          routerLink="/clients"
          routerLinkActive="text-blue-400"
          [routerLinkActiveOptions]="{ exact: true }"
          >Clients</a
        >
        <a routerLink="/check-in" routerLinkActive="text-blue-400">Check-in</a>
        <a routerLink="/attendance" routerLinkActive="text-blue-400">Attendance</a>
      </nav>
    }

    <!-- Right side: user or login -->
    <div class="flex items-center ml-auto gap-2 md:gap-3">
      @if (accountService.currentUser(); as user) {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="hidden sm:block size-8 md:size-10"
        >
          <path
            fill-rule="evenodd"
            d="M18.685 19.097A9.723 9.723 0 0 0 21.75 12c0-5.385-4.365-9.75-9.75-9.75S2.25 6.615 2.25 12a9.723 9.723 0 0 0 3.065 7.097A9.716 9.716 0 0 0 12 21.75a9.716 9.716 0 0 0 6.685-2.653Zm-12.54-1.285A7.486 7.486 0 0 1 12 15a7.486 7.486 0 0 1 5.855 2.812A8.224 8.224 0 0 1 12 20.25a8.224 8.224 0 0 1-5.855-2.438ZM15.75 9a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
            clip-rule="evenodd"
          />
        </svg>
        <span class="hidden sm:inline text-xl md:text-3xl font-normal text-blue-950">{{
          user.displayName
        }}</span>
        <button type="button" class="btn btn-neutral bg-black btn-sm md:btn-md" (click)="logout()">
          Logout
        </button>
      } @else {
        <!-- Phones: login opens a small dropdown -->
        <div class="dropdown dropdown-end md:hidden">
          <div tabindex="0" role="button" class="btn btn-neutral bg-yellow-600 border-yellow-600">
            Login
          </div>
          <div
            tabindex="0"
            class="dropdown-content bg-base-100 rounded-box z-10 mt-3 w-64 p-4 shadow"
          >
            <ng-container [ngTemplateOutlet]="loginFields" />
          </div>
        </div>
        <!-- Desktop: the form stays inline -->
        <div class="hidden md:block">
          <ng-container [ngTemplateOutlet]="loginFields" />
        </div>
      }
    </div>
  </div>
</header>
